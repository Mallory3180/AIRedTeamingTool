[project]
name = "llm-red-teaming-orchestrator"
version = "0.1.0"
description = "LLM Red Teaming Orchestrator scaffold"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "langchain>=0.2",
  "langchain-community>=0.2",
  "langchain-text-splitters>=0.2",
  "chromadb>=0.5",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]
